# Render Blueprint — L'Oréal Capitol (version web, site statique)
# Sur Render : New > Blueprint > choisir ce dépôt GitHub. Render lit ce fichier,
# construit l'app Expo pour le web (dossier dist/) et la sert en HTTPS.
# Chaque push sur la branche main redéploie automatiquement.
services:
  - type: web
    name: loreal-capitol
    runtime: static
    branch: main
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    # --include=dev : le build n'échoue pas si NODE_ENV=production est défini
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Ne JAMAIS définir EXPO_PUBLIC_USE_EMULATOR ici : la version en ligne
      # doit utiliser la vraie base Firebase, pas l'émulateur local.
    headers:
      # Fichiers JS/CSS d'Expo : nom versionné, cache long
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Pages : toujours revalider pour recevoir les mises à jour tout de suite
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /receipt.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # Sécurité de base
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      # Lien court du reçu client
      - type: rewrite
        source: /receipt
        destination: /receipt.html
      # Application monopage : toute autre URL renvoie l'app
      # (Render sert d'abord les fichiers existants, puis applique ces règles)
      - type: rewrite
        source: /*
        destination: /index.html
